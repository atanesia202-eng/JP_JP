 ga arimasu,มีไข้|くすりを ください,kusuri o kudasai,ขอยา|たすけて ください,tasukete kudasai,ช่วยด้วย|みちに まよいました,michi ni mayoimashita,หลงทาง|みぎに まがります,migi ni magarimasu,เลี้ยวขวา|ひだりに まがります,hidari ni magarimasu,เลี้ยวซ้าย|あるいて いきます,aruite ikimasu,เดินไป|いえに かえります,ie ni kaerimasu,กลับบ้าน|がっこうに いきます,gakkou ni ikimasu,ไปโรงเรียน|ほんを よみます,hon o yomimasu,อ่านหนังสือ|てがみを かきます,tegami o kakimasu,เขียนจดหมาย|おんがくを ききます,ongaku o kikimasu,ฟังเพลง|ともだちと あそびます,tomodachi to asobimasu,เล่นกับเพื่อน|ありがとうございます,arigatou gozaimasu,ขอบคุณมาก"));

const LV=[

function quiz(o){let L=o.ordered?o.items:shuf(o.items),i=0,sc=0,bad=[],dn=0;
function show(){if(i>=L.length)return end();const it=L[i];dn=0;
set(hdr(o.title+` · ${i+1}/${L.length}`,i/L.length*100)+`<div class="card"><div class="big ${o.sm||it.big.length>2?'s':''}">${it.big}</div><div class="sub">${it.sub||''}</div><input id="in" autocomplete="off" autocapitalize="off" placeholder="พิมพ์โรมันจิ (เปลี่ยนคีย์บอร์ดเป็น EN)" lang="en" inputmode="latin" spellcheck="false"><div id="fb"></div><button class="b" id="bt">ตรวจ</button></div>`);
$('hm').onclick=menu;$('in').focus();
const go=()=>{if(dn){i++;return show()}const r=ok($('in').value,it.a);dn=1;if(r)sc++;else bad.push(it);
$('fb').innerHTML=r?'<span class="good">✓ ถูกต้อง!</span>':`<span class="bad">✗ คำตอบ: ${it.a}</span>`;$('in').disabled=1;$('bt').textContent='ต่อไป';$('bt').focus()};
$('bt').onclick=go;document.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}}}
function end(){document.onkeydown=null;const p=Math.round(sc/L.length*100);
set(hdr(o.title)+`<div class="card"><div class="big">${p>=80?'🎉':'💪'}</div><h2>${sc} / ${L.length} (${p}%)</h2>${bad.length?`<div class="note">ที่ผิด: ${bad.map(b=>`<span class="jp">${b.big}</span>=${b.a}`).join(' · ')}</div>`:''}
<button class="b" id="a1">${o.next||'เมนู'}</button>${bad.length?'<button class="b g" id="a2">ทำข้อที่ผิดซ้ำ</button>':''}<button class="b g" id="a3">ทำใหม่</button></div>`);
$('hm').onclick=menu;$('a1').onclick=o.done;$('a3').onclick=()=>quiz(o);if(bad.length)$('a2').onclick=()=>quiz({...o,items:bad,ordered:0,done:o.done})}
show()}
function draw(){const L=shuf([...ALL,...ALLD]);let i=0,sc=0;
function show(){if(i>=L.length){set(hdr('วาดตัวอักษร')+`<div class="card"><div class="big">🖌️</div><h2>${sc} / ${L.length}</h2><button class="b" id="m">เมนู</button></div>`);$('hm').onclick=$('m').onclick=menu;return}
const it=L[i];set(hdr(`วาดตัวอักษร · ${i+1}/${L.length}`,i/L.length*100)+`<div class="card"><div class="sub">วาดตัวที่อ่านว่า</div><div class="big" style="font-family:inherit;font-size:3rem">${it.r}</div><canvas id="cv" width="520" height="520"></canvas><div id="ans" class="big" style="margin:0;visibility:hidden">${it.k}</div><div id="ctl"><button class="b g" id="cl">ล้าง</button><button class="b" id="sh">ดูเฉลย</button></div></div>`);
$('hm').onclick=menu;const c=$('cv'),x=c.getContext('2d');x.lineWidth=16;x.lineCap=x.lineJoin='round';x.strokeStyle=getComputedStyle(document.body).color;let d=0;
const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*520/r.width,(e.clientY-r.top)*520/r.height]};
c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e))};c.onpointermove=e=>{if(d){x.lineTo(...pt(e));x.stroke()}};c.onpointerup=()=>d=0;
$('cl').onclick=()=>x.clearRect(0,0,520,520);
$('sh').onclick=()=>{$('ans').style.visibility='visible';$('ctl').innerHTML='<div class="sub">เทียบกับเฉลย วาดถูกไหม?</div><button class="b" id="y">ถูก</button><button class="b g" id="n">ผิด</button>';$('y').onclick=()=>{sc++;i++;show()};$('n').onclick=()=>{i++;show()}}}
show()}
function tsu(){set(hdr('เสียงซ้อน っ')+`<div class="card"><div class="big">っ</div><div class="note">っ ตัวเล็ก (<b>sokuon</b>) ไม่ออกเสียงเอง แต่ให้ <b>หยุดสั้นๆ แล้ว “ซ้อน” พยัญชนะตัวถัดไป</b><ul>
<li>きって → ki<b>t</b>te (ซ้อน t)</li><li>ざっし → za<b>s</b>shi (ซ้อน s : っ + し = sshi)</li><li>がっこう → ga<b>k</b>kou (ซ้อน k)</li><li>いっぱい → i<b>p</b>pai (ซ้อน p)</li></ul>
กฎ: ดูตัวที่ตามหลัง っ แล้วพิมพ์พยัญชนะตัวแรกซ้ำสองครั้ง เช่น っち → tchi, っつ → ttsu<br>ตัว <b>つ</b> ปกติอ่านว่า tsu (ใหญ่) ส่วน <b>っ</b> ตัวเล็กคือเสียงซ้อน</div>
<button class="b" id="go">เริ่มเทส</button></div>`);$('hm').onclick=menu;
$('go').onclick=tsuQ}
const tsuQ=()=>quiz({items:TSU.map(x=>({big:x.k,sub:x.t,a:x.r})),title:'เทสเสียงซ้อน っ',done:menu});
menu();
</script></body></html>
